spring.application.name=nexus-stock
server.port=8080

# Motor de datos (Abstract Factory): h2 = DAOs JDBC sobre H2, memoria = colecciones Java sin base
nexus.persistencia=h2

# Base H2 en memoria: schema.sql y data.sql se cargan en cada arranque
spring.datasource.url=jdbc:h2:mem:nexus;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.sql.init.mode=always
spring.sql.init.encoding=UTF-8

# Consola web para mirar las tablas en la defensa: http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
